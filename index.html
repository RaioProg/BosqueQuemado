<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TierroQuemada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="panel-config">
            <p>Anchura del bosque M: </p>
            <input type="text" placeholder="M (Anchura del bosque)" id="spin_anchura_bosque">
            <p>Altura del bosque N: </p>
            <input type="text" placeholder="N (Altura del bosque)">
            <p>Probabilidad arbol P:</p>
            <input type="text" placeholder="P (Probabilidad de Arbol)">
            <p>Probabilidad incendio Q:</p>
            <input type="text" placeholder="Q (Probabilidad de Incendio)">
            <button type="submit" id="simulacion">Iniciar Simulación</button>
        </div>
    </main>
    <script src="action.js"></script>
</body>
</html>
